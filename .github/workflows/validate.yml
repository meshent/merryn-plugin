name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the marketplace and plugin manifests
        run: |
          npx -y @anthropic-ai/claude-code plugin validate .
          for p in plugins/*/; do npx -y @anthropic-ai/claude-code plugin validate "$p"; done
      - name: Check skills, MCP binding and secrets
        run: python3 scripts/check.py
